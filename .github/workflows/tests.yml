name: Tests

# §7 gate: "Tests (macOS matrix) | swift test on Swift 6.2 + nightly
# toolchain | all green".
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: swift test (${{ matrix.toolchain }})
    runs-on: macos-15
    # §7 marks the nightly toolchain as the non-required half of this row:
    # a break in an unreleased compiler is information, not a reason to
    # block every PR. The released-toolchain leg stays required.
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [swift-6.2, nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Select a Swift 6.2+ toolchain
        run: |
          set -euo pipefail
          # Package.swift is `swift-tools-version: 6.2` and uses SwiftPM 6.2
          # manifest APIs (`.treatAllWarnings(as:)`, `.defaultIsolation(_:)`),
          # so a Swift 6.1 toolchain cannot even parse it. Pin no version
          # path -- image updates rename them -- but pick the newest non-beta
          # Xcode that actually ships Swift 6.2 or later, and fail loudly if
          # the image carries none.
          for app in $(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -Vr); do
            bin="$app/Contents/Developer/usr/bin/swift"
            [ -x "$bin" ] || continue
            ver=$("$bin" -version 2>/dev/null | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -n 1)
            [ -n "$ver" ] || continue
            if [ "$(printf '%s\n6.2\n' "$ver" | sort -V | head -n 1)" = "6.2" ]; then
              echo "Selected $app (Swift $ver)"
              sudo xcode-select -s "$app"
              swift --version
              exit 0
            fi
          done
          echo "::error::No installed Xcode ships Swift 6.2 or later; Package.swift (swift-tools-version: 6.2) cannot be parsed."
          exit 1

      # swift-actions/setup-swift cannot install a nightly on this leg:
      # it runs semver validation on `swift-version`, and a snapshot
      # spelling such as `nightly-main` is not a valid semver range, so the
      # action throws before it downloads anything. swiftly is Swift.org's
      # own toolchain manager and takes `main-snapshot` directly.
      - name: Install nightly toolchain (swiftly)
        if: matrix.toolchain == 'nightly'
        run: |
          set -euo pipefail
          curl -fsSL -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --assume-yes --skip-install --quiet-shell-followup
          # shellcheck disable=SC1091
          . "$HOME/.swiftly/env.sh"
          swiftly install main-snapshot --use --assume-yes
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          swift --version

      - name: swift test
        run: swift test
