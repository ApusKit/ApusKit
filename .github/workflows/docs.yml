name: Docs

# §7 gate: "Docs | swift package generate-documentation
# --warnings-as-errors, scoped with one --target per ApusKit target |
# clean" (DOC-1: DocC per target).
#
# The --target list below is normative and must stay in sync with TRD §7,
# .spi.yml's documentation_targets, and docs/ci-deferrals.md, which
# records why the unscoped form cannot be used.
#
# With no `--target`, swift-docc-plugin documents
# `Package.allDocumentableTargets`, which its own source documents as
# "All targets defined in this package *and its dependencies*"
# (Plugins/SharedPackagePluginExtensions/PackageExtensions.swift). It
# therefore also builds documentation for swift-json-schema's JSONSchema
# and JSONSchemaBuilder modules, and a broken doc-comment cross-reference
# in JSONSchemaBuilder (`Keywords.AdditionalProperties` in
# JSONComponent/TypeSpecific/JSONObject.swift) fails the run under
# --warnings-as-errors. That defect is in a pinned third-party
# dependency, not in ApusKit: all five ApusKit targets document cleanly.
# Scoping to them is what DOC-1 ("DocC per target") actually asks for.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    name: generate-documentation --warnings-as-errors
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select a Swift 6.2+ toolchain
        run: |
          set -euo pipefail
          # Package.swift is `swift-tools-version: 6.2` and uses SwiftPM 6.2
          # manifest APIs (`.treatAllWarnings(as:)`, `.defaultIsolation(_:)`),
          # so a Swift 6.1 toolchain cannot even parse it. Pin no version
          # path -- image updates rename them -- but pick the newest non-beta
          # Xcode that actually ships Swift 6.2 or later, and fail loudly if
          # the image carries none.
          for app in $(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -Vr); do
            bin="$app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
            [ -x "$bin" ] || continue
            ver=$("$bin" -version 2>/dev/null | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -n 1)
            [ -n "$ver" ] || continue
            if [ "$(printf '%s\n6.2\n' "$ver" | sort -V | head -n 1)" = "6.2" ]; then
              echo "Selected $app (Swift $ver)"
              sudo xcode-select -s "$app"
              swift --version
              exit 0
            fi
          done
          echo "::error::No installed Xcode ships Swift 6.2 or later; Package.swift (swift-tools-version: 6.2) cannot be parsed."
          exit 1

      - name: Generate documentation
        run: |
          swift package generate-documentation \
            --target ApusKitCore \
            --target ApusKitWireFormat \
            --target ApusKitProviders \
            --target ApusKitTools \
            --target ApusKitSessions \
            --target ApusKitAgent \
            --target ApusKit \
            --warnings-as-errors
